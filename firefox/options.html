<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Gemini Pro Auto Default Settings</title>
    <link rel="stylesheet" href="options.css" />
  </head>
  <body>
    <main class="options-root">
      <header class="hero">
        <p class="eyebrow">Gemini Pro Auto Default</p>
        <h1>Forced Model Mode</h1>
        <p class="description">Select the mode this extension should enforce when Gemini opens.</p>
      </header>

      <form id="mode-form" class="mode-form">
        <label class="mode-option">
          <input id="mode-pro" type="radio" name="forcedMode" value="pro" />
          <div class="option-content">
            <span class="option-title">Force Pro</span>
            <span class="option-note">Faster responses for everyday use.</span>
          </div>
          <span class="option-badge">Recommended</span>
        </label>

        <label class="mode-option">
          <input id="mode-thinking" type="radio" name="forcedMode" value="thinking" />
          <div class="option-content">
            <span class="option-title">Force Thinking</span>
            <span class="option-note">More deliberate reasoning for complex prompts.</span>
          </div>
        </label>
      </form>

      <div class="status-row">
        <p id="save-status" class="save-status" aria-live="polite"></p>
        <p class="hint">Changes are saved automatically.</p>
      </div>
    </main>

    <script src="extension-api.js"></script>
    <script src="options.js"></script>
  </body>
</html>
