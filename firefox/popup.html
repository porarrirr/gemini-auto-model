<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Gemini Mode Switcher</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main class="popup-root">
      <header class="popup-header">
        <p class="eyebrow">Gemini Control</p>
        <h1>Mode</h1>
      </header>

      <form id="mode-form" class="mode-form">
        <label class="mode-option">
          <input type="radio" name="forcedMode" value="pro" />
          <div class="option-content">
            <span class="option-title">Force Pro</span>
            <span class="option-note">Fast default</span>
          </div>
        </label>

        <label class="mode-option">
          <input type="radio" name="forcedMode" value="thinking" />
          <div class="option-content">
            <span class="option-title">Force Thinking</span>
            <span class="option-note">Deep reasoning</span>
          </div>
        </label>
      </form>

      <p id="save-status" class="save-status" aria-live="polite"></p>

      <button id="open-options" class="link-button" type="button">Open full settings</button>
    </main>
    <script src="extension-api.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
